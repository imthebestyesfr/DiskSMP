
name: Build DiskSMP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload DiskSMP JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiskSMP
          path: target/DiskSMP-1.0.0.jar
